<!DOCTYPE html>
<html lang="fr" data-theme="nuit">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Djouba</title>
<style>
{{CSS}}
</style>
</head>
<body>
<header class="bar">
  <h1 data-i18n="app.title">Djouba</h1>
  <div class="bar-controls">
    <label for="sel-lang" data-i18n="set.lang">Langue</label>
    <select id="sel-lang">
      <option value="fr">Français</option>
      <option value="kr">Kréyòl matnitjé</option>
      <option value="en">English</option>
      <option value="es">Español</option>
    </select>
  </div>
</header>

<nav class="tabs" role="tablist" id="tabs">
  <button type="button" role="tab" class="tab" data-tab="cours" id="tab-cours" aria-controls="panel-cours" data-i18n="tab.cours">Cours</button>
  <button type="button" role="tab" class="tab" data-tab="exercice" id="tab-exercice" aria-controls="panel-exercice" data-i18n="tab.exercice">Exercice</button>
  <button type="button" role="tab" class="tab" data-tab="glossaire" id="tab-glossaire" aria-controls="panel-glossaire" data-i18n="tab.glossaire">Glossaire</button>
  <button type="button" role="tab" class="tab" data-tab="sources" id="tab-sources" aria-controls="panel-sources" data-i18n="tab.sources">Sources</button>
  <button type="button" role="tab" class="tab" data-tab="voix" id="tab-voix" aria-controls="panel-voix" data-i18n="tab.voix">Voix</button>
  <button type="button" role="tab" class="tab" data-tab="reglages" id="tab-reglages" aria-controls="panel-reglages" data-i18n="tab.reglages">Réglages</button>
</nav>

<noscript>
  <p class="note">JavaScript est bloqué. Ouvrez ce fichier avec Chrome ou Firefox. / JavaScript is blocked. Open this file in Chrome or Firefox. / JavaScript está bloqueado. Abra este archivo con Chrome o Firefox.</p>
</noscript>

<main>
  <section id="panel-cours" class="panel" role="tabpanel" aria-labelledby="tab-cours">
    <div class="row">
      <label for="sel-level" data-i18n="course.level">Niveau</label>
      <select id="sel-level"></select>
    </div>
    <div class="row">
      <label for="sel-course" data-i18n="course.course">Cours</label>
      <select id="sel-course"></select>
    </div>
    <div class="row">
      <label for="sel-chapter" data-i18n="course.chapter">Étape</label>
      <select id="sel-chapter"></select>
    </div>
    <div class="row buttons">
      <button type="button" id="btn-prev" data-i18n="course.prev">Précédent</button>
      <button type="button" id="btn-next" data-i18n="course.next">Suivant</button>
    </div>
    <article id="course-text" class="reading" aria-live="polite"></article>
  </section>

  <section id="panel-exercice" class="panel" role="tabpanel" aria-labelledby="tab-exercice" hidden>
    <div class="row">
      <label for="sel-ex-chapter" data-i18n="course.chapter">Étape</label>
      <select id="sel-ex-chapter"></select>
    </div>
    <p id="ex-question" class="reading"></p>
    <div class="row">
      <label for="sel-ex-answer" data-i18n="ex.choose">Votre réponse</label>
      <select id="sel-ex-answer"></select>
    </div>
    <div class="row buttons">
      <button type="button" id="btn-aide1" data-i18n="ex.aide1">Aide 1</button>
      <button type="button" id="btn-aide2" data-i18n="ex.aide2">Aide 2</button>
      <button type="button" id="btn-reponse" data-i18n="ex.answer">Voir la réponse</button>
      <button type="button" id="btn-restart" data-i18n="ex.restart">Recommencer</button>
    </div>
    <p id="ex-feedback" class="reading" role="status" aria-live="polite"></p>
  </section>

  <section id="panel-glossaire" class="panel" role="tabpanel" aria-labelledby="tab-glossaire" hidden>
    <div class="row">
      <label for="sel-gloss" data-i18n="gloss.word">Mot</label>
      <select id="sel-gloss"></select>
    </div>
    <p id="gloss-def" class="reading" aria-live="polite"></p>
  </section>

  <section id="panel-sources" class="panel" role="tabpanel" aria-labelledby="tab-sources" hidden>
    <div class="row">
      <label for="sel-src-kind" data-i18n="src.kind">Liste</label>
      <select id="sel-src-kind"></select>
    </div>
    <div class="row">
      <label for="sel-src-type" data-i18n="src.type">Type</label>
      <select id="sel-src-type"></select>
    </div>
    <div class="row">
      <label for="sel-src-var" data-i18n="src.var">Variété</label>
      <select id="sel-src-var"></select>
    </div>
    <div class="row">
      <label for="sel-src-item" data-i18n="src.item">Document</label>
      <select id="sel-src-item"></select>
    </div>
    <p id="src-count" class="note" role="status"></p>
    <p id="src-detail" class="reading" aria-live="polite"></p>
    <div class="row buttons">
      <button type="button" id="btn-open" data-i18n="src.open">Ouvrir le lien</button>
    </div>
    <p id="src-net" class="note"></p>
  </section>

  <section id="panel-voix" class="panel" role="tabpanel" aria-labelledby="tab-voix" hidden>
    <div class="row">
      <label for="sel-voice" data-i18n="voice.voice">Voix</label>
      <select id="sel-voice"></select>
    </div>
    <div class="row">
      <label for="sel-speed" data-i18n="voice.speed">Vitesse</label>
      <select id="sel-speed">
        <option value="0.6">0,6×</option>
        <option value="0.8">0,8×</option>
        <option value="1">1×</option>
        <option value="1.2">1,2×</option>
      </select>
    </div>
    <div class="row buttons">
      <button type="button" id="btn-read" data-i18n="voice.read">Lire</button>
      <button type="button" id="btn-pause" data-i18n="voice.pause">Pause</button>
      <button type="button" id="btn-resume" data-i18n="voice.resume">Continuer</button>
      <button type="button" id="btn-stop" data-i18n="voice.stop">Arrêter</button>
    </div>
    <p id="voice-note" class="note" role="status"></p>
  </section>

  <section id="panel-reglages" class="panel" role="tabpanel" aria-labelledby="tab-reglages" hidden>
    <div class="row">
      <label for="sel-theme" data-i18n="set.theme">Couleurs</label>
      <select id="sel-theme">
        <option value="nuit" data-i18n="theme.nuit">Nuit</option>
        <option value="ardoise" data-i18n="theme.ardoise">Ardoise</option>
        <option value="foret" data-i18n="theme.foret">Forêt</option>
      </select>
    </div>
  </section>
</main>

<script>
window.DJOUBA_DATA = {{DATA}};
</script>
<script>
{{JS}}
</script>
</body>
</html>
