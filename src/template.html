<!doctype html>
<html lang="fr" data-size="normal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>Mon dictionnaire visuel : la maison</title>
<style>
:root {
  --bg: #FFFDF7; --fg: #1A1A1A; --muted: #4A4A4A; --card: #FFFFFF; --line: #8A8A8A;
  --ok: #1B5E20; --okbg: #E8F5E9; --ko: #8A1C1C; --kobg: #FDECEA; --sol: #0D3C61; --solbg: #E3F2FD;
  --focus: #0B57D0; --primary: #1F3A93; --primary-fg: #FFFFFF; --obj: #1F3A93;
}
html { font-size: 100%; }
html[data-size="large"] { font-size: 118%; }
html[data-size="xlarge"] { font-size: 136%; }
html.dys body { font-family: "OpenDyslexic", "Lexend", "Comic Sans MS", "Verdana", sans-serif; letter-spacing: .04em; word-spacing: .14em; line-height: 1.75; }
html.hc { --bg: #FFFFFF; --fg: #000000; --muted: #000000; --line: #000000; --primary: #000000; }
html.hc .part > * { stroke: #000 !important; stroke-width: 2.5px !important; }
html.hc .label text { font-weight: 700; }
html.noanim *, html.noanim *::before, html.noanim *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: system-ui, "Segoe UI", Roboto, Arial, sans-serif; line-height: 1.5; }
#app { max-width: 980px; margin: 0 auto; padding: 12px 16px 32px; }
h1 { font-size: 1.5rem; margin: .4rem 0 .8rem; }
h2 { font-size: 1.35rem; margin: 0; }
h3 { font-size: 1.05rem; margin: 1rem 0 .4rem; }
.sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label { font-weight: 600; font-size: .95rem; }
select, .btn, input[type=checkbox] + label { min-height: 44px; font: inherit; }
select { width: 100%; padding: 8px 10px; border: 2px solid var(--line); border-radius: 10px; background: var(--card); color: var(--fg); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 16px; border: 2px solid var(--fg); border-radius: 10px; background: var(--card); color: var(--fg); cursor: pointer; text-align: center; transition: transform .1s; }
.btn:hover { transform: translateY(-1px); }
.btn.primary { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); }
.btn[disabled] { opacity: .45; cursor: not-allowed; transform: none; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
.part:focus-visible { outline: none; }
.part:focus-visible > * { stroke: var(--focus) !important; stroke-width: 4px !important; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; margin: 10px 0; }
.row .field { flex: 1 1 200px; }
.nav .btn { flex: 0 1 auto; }
.panel { margin: 10px 0 0; border: 2px solid var(--line); border-radius: 12px; background: var(--card); padding: 0 12px; }
.panel summary { min-height: 44px; display: flex; align-items: center; font-weight: 700; cursor: pointer; }
.panel[open] { padding-bottom: 12px; }
.cbrow { display: flex; align-items: center; gap: 10px; margin: 4px 0; }
.cbrow input { width: 26px; height: 26px; margin: 0; flex: none; accent-color: var(--primary); }
.cbrow label { display: flex; align-items: center; flex: 1; cursor: pointer; }
.warning { font-size: .9rem; color: var(--ko); background: var(--kobg); padding: 8px 10px; border-radius: 8px; }
.autonotice { background: #FFF4CE; color: #3D2E00; border: 1px solid #B38600; padding: 6px 10px; border-radius: 8px; font-size: .92rem; }
.stage { margin-top: 12px; background: var(--card); border: 3px solid var(--obj); border-radius: 16px; overflow: hidden; }
.objhead { padding: 12px 16px; }
.objhead p { margin: .2rem 0 0; }
.stage > .register, .stage > .field, .stage > .activity { margin-left: 16px; margin-right: 16px; }
.register { font-size: .9rem; color: var(--muted); margin-top: 10px; }
.activity { padding-bottom: 16px; }
.platewrap { background: #FBF8F0; border: 1px solid #E2DCCB; border-radius: 12px; margin: 10px 0; }
html.hc .platewrap { background: #FFF; border-color: #000; }
.plate { display: block; width: 100%; height: auto; max-height: 70vh; }
.plate.mini { width: 100%; max-height: 150px; }
.part { cursor: default; }
.part[role=button], .label { cursor: pointer; }
.part.hl > * { stroke: #000; stroke-width: 4px; filter: drop-shadow(0 0 5px #FFD54F); }
.leader { stroke: #222; stroke-width: 1.6; fill: none; }
.arrowhead, .dot { fill: #222; }
.label text { fill: #111; font-family: inherit; }
.label.hl text { font-weight: 800; fill: #0B3D91; }
.label.hl .leader { stroke: #0B3D91; stroke-width: 2.6; }
.label.mystery text { fill: #B00020; font-weight: 800; }
.partlist { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 44px; padding: 6px 14px; border-radius: 22px; border: 2px solid var(--obj); background: var(--card); color: var(--fg); font: inherit; cursor: pointer; }
.chip.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.defcard { margin-top: 12px; border-left: 8px solid; padding: 10px 14px; background: #FFFBEA; border-radius: 8px; }
html.hc .defcard { background: #FFF; border: 3px solid #000; }
.defcard p { margin: .3rem 0; }
.defword { font-size: 1.3rem; font-weight: 800; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.prompt { font-size: 1.15rem; }
.feedback { border-radius: 10px; padding: 8px 12px; margin: 10px 0; }
.feedback p { margin: .2rem 0; }
.feedback.ok { background: var(--okbg); color: var(--ok); }
.feedback.ko, .feedback.info { background: var(--kobg); color: var(--ko); }
.feedback.sol { background: var(--solbg); color: var(--sol); }
.strong { font-weight: 700; }
.qcm { border: 2px solid var(--line); border-radius: 12px; padding: 8px 12px; margin: 10px 0; }
.qcm legend { font-weight: 700; padding: 0 6px; }
.cbrow.good label { color: var(--ok); font-weight: 700; }
.cbrow.bad label { color: var(--ko); text-decoration: line-through; }
.misconception { background: #FFF4CE; color: #3D2E00; border-radius: 10px; padding: 4px 14px; }
.roomtitle { font-size: 1.1rem; margin: 18px 0 0; padding: 6px 12px; border-radius: 10px; }
.objhead .roomtag { margin: 0; font-size: .85rem; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.roomrow th { background: #F1EDE4; }
html.hc .roomrow th { background: #FFF; }
.gallery { list-style: none; padding: 0; margin: 12px 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.card { width: 100%; display: flex; flex-direction: column; align-items: stretch; gap: 6px; padding: 8px; border: 3px solid; border-radius: 14px; background: var(--card); color: var(--fg); font: inherit; cursor: pointer; }
.cardname { font-weight: 700; padding: 4px 8px; border-radius: 8px; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .92rem; }
caption { text-align: left; font-weight: 700; padding: 6px 0; }
th, td { border: 1px solid var(--line); padding: 4px 6px; text-align: left; }
.mapframe { position: relative; height: 620px; margin-top: 12px; border: 2px solid var(--line); border-radius: 16px; background: var(--card); overflow: hidden; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.maplines { position: absolute; left: 0; top: 0; width: 100%; pointer-events: none; }
.maphint { position: absolute; left: 10px; right: 10px; bottom: 8px; margin: 0; font-size: .8rem; color: var(--muted); pointer-events: none; }
.mapnode { position: absolute; min-height: 44px; min-width: 44px; max-width: 150px; padding: 6px 10px; border-radius: 22px; border: 2px solid rgba(0,0,0,.55); font: inherit; font-size: .92rem; line-height: 1.2; cursor: grab; touch-action: none; }
.mapnode.center { font-weight: 800; max-width: 170px; }
.mapnode.branch { font-weight: 800; }
.mapnode.sub { font-weight: 700; }
.mapnode.locked { font-weight: 800; }
.mappanel { position: absolute; left: 10px; right: 10px; bottom: 8px; max-height: 160px; overflow-y: auto; z-index: 5; background: var(--card); color: var(--fg); border: 3px solid var(--fg); border-radius: 12px; padding: 8px 12px; box-shadow: 0 4px 14px rgba(0,0,0,.25); }
.mappanel h3 { margin: 0 0 .2rem; font-size: 1rem; }
.mappanel .btn { min-height: 44px; padding: 4px 14px; }
.mappanel p { margin: 0 0 .5rem; }
footer { margin-top: 24px; font-size: .85rem; color: var(--muted); }
@media (max-width: 520px) {
  h1 { font-size: 1.25rem; }
  .nav .btn { flex: 1 1 40%; }
  .nav .field { order: -1; flex-basis: 100%; }
  .mapframe { height: 780px; }
  .mapnode, .mapnode.center { max-width: 118px; font-size: .85rem; padding: 4px 8px; }
}
</style>
</head>
<body>
<div id="app"></div>
<div id="live" class="sr-only" role="status" aria-live="polite"></div>
<noscript><p>Cette application a besoin de JavaScript (fonctionne sans Internet).</p></noscript>
<script>
{{CONFIG}}
{{CORE}}
{{CONTENT}}
{{MAP}}
{{APP}}
</script>
</body>
</html>
