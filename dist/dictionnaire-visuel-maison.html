<!doctype html>
<html lang="fr" data-size="normal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>Mon dictionnaire visuel : la maison</title>
<style>
:root {
  --bg: #FFFDF7; --fg: #1A1A1A; --muted: #4A4A4A; --card: #FFFFFF; --line: #8A8A8A;
  --ok: #1B5E20; --okbg: #E8F5E9; --ko: #8A1C1C; --kobg: #FDECEA; --sol: #0D3C61; --solbg: #E3F2FD;
  --focus: #0B57D0; --primary: #1F3A93; --primary-fg: #FFFFFF; --obj: #1F3A93;
}
html { font-size: 100%; }
html[data-size="large"] { font-size: 118%; }
html[data-size="xlarge"] { font-size: 136%; }
html.dys body { font-family: "OpenDyslexic", "Lexend", "Comic Sans MS", "Verdana", sans-serif; letter-spacing: .04em; word-spacing: .14em; line-height: 1.75; }
html.hc { --bg: #FFFFFF; --fg: #000000; --muted: #000000; --line: #000000; --primary: #000000; }
html.hc .part > * { stroke: #000 !important; stroke-width: 2.5px !important; }
html.hc .label text { font-weight: 700; }
html.noanim *, html.noanim *::before, html.noanim *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: system-ui, "Segoe UI", Roboto, Arial, sans-serif; line-height: 1.5; }
#app { max-width: 980px; margin: 0 auto; padding: 12px 16px 32px; }
h1 { font-size: 1.5rem; margin: .4rem 0 .8rem; }
h2 { font-size: 1.35rem; margin: 0; }
h3 { font-size: 1.05rem; margin: 1rem 0 .4rem; }
.sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label { font-weight: 600; font-size: .95rem; }
select, .btn, input[type=checkbox] + label { min-height: 44px; font: inherit; }
select { width: 100%; padding: 8px 10px; border: 2px solid var(--line); border-radius: 10px; background: var(--card); color: var(--fg); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 16px; border: 2px solid var(--fg); border-radius: 10px; background: var(--card); color: var(--fg); cursor: pointer; text-align: center; transition: transform .1s; }
.btn:hover { transform: translateY(-1px); }
.btn.primary { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); }
.btn[disabled] { opacity: .45; cursor: not-allowed; transform: none; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
.part:focus-visible { outline: none; }
.part:focus-visible > * { stroke: var(--focus) !important; stroke-width: 4px !important; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; margin: 10px 0; }
.row .field { flex: 1 1 200px; }
.nav .btn { flex: 0 1 auto; }
.panel { margin: 10px 0 0; border: 2px solid var(--line); border-radius: 12px; background: var(--card); padding: 0 12px; }
.panel summary { min-height: 44px; display: flex; align-items: center; font-weight: 700; cursor: pointer; }
.panel[open] { padding-bottom: 12px; }
.cbrow { display: flex; align-items: center; gap: 10px; margin: 4px 0; }
.cbrow input { width: 26px; height: 26px; margin: 0; flex: none; accent-color: var(--primary); }
.cbrow label { display: flex; align-items: center; flex: 1; cursor: pointer; }
.warning { font-size: .9rem; color: var(--ko); background: var(--kobg); padding: 8px 10px; border-radius: 8px; }
.autonotice { background: #FFF4CE; color: #3D2E00; border: 1px solid #B38600; padding: 6px 10px; border-radius: 8px; font-size: .92rem; }
.stage { margin-top: 12px; background: var(--card); border: 3px solid var(--obj); border-radius: 16px; overflow: hidden; }
.objhead { padding: 12px 16px; }
.objhead p { margin: .2rem 0 0; }
.stage > .register, .stage > .field, .stage > .activity { margin-left: 16px; margin-right: 16px; }
.register { font-size: .9rem; color: var(--muted); margin-top: 10px; }
.activity { padding-bottom: 16px; }
.platewrap { background: #FBF8F0; border: 1px solid #E2DCCB; border-radius: 12px; margin: 10px 0; }
html.hc .platewrap { background: #FFF; border-color: #000; }
.plate { display: block; width: 100%; height: auto; max-height: 70vh; }
.plate.mini { width: 100%; max-height: 150px; }
.part { cursor: default; }
.part[role=button], .label { cursor: pointer; }
.part.hl > * { stroke: #000; stroke-width: 4px; filter: drop-shadow(0 0 5px #FFD54F); }
.leader { stroke: #222; stroke-width: 1.6; fill: none; }
.arrowhead, .dot { fill: #222; }
.label text { fill: #111; font-family: inherit; }
.label.hl text { font-weight: 800; fill: #0B3D91; }
.label.hl .leader { stroke: #0B3D91; stroke-width: 2.6; }
.label.mystery text { fill: #B00020; font-weight: 800; }
.partlist { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 44px; padding: 6px 14px; border-radius: 22px; border: 2px solid var(--obj); background: var(--card); color: var(--fg); font: inherit; cursor: pointer; }
.chip.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.defcard { margin-top: 12px; border-left: 8px solid; padding: 10px 14px; background: #FFFBEA; border-radius: 8px; }
html.hc .defcard { background: #FFF; border: 3px solid #000; }
.defcard p { margin: .3rem 0; }
.defword { font-size: 1.3rem; font-weight: 800; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.prompt { font-size: 1.15rem; }
.feedback { border-radius: 10px; padding: 8px 12px; margin: 10px 0; }
.feedback p { margin: .2rem 0; }
.feedback.ok { background: var(--okbg); color: var(--ok); }
.feedback.ko, .feedback.info { background: var(--kobg); color: var(--ko); }
.feedback.sol { background: var(--solbg); color: var(--sol); }
.strong { font-weight: 700; }
.qcm { border: 2px solid var(--line); border-radius: 12px; padding: 8px 12px; margin: 10px 0; }
.qcm legend { font-weight: 700; padding: 0 6px; }
.cbrow.good label { color: var(--ok); font-weight: 700; }
.cbrow.bad label { color: var(--ko); text-decoration: line-through; }
.misconception { background: #FFF4CE; color: #3D2E00; border-radius: 10px; padding: 4px 14px; }
.gallery { list-style: none; padding: 0; margin: 12px 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.card { width: 100%; display: flex; flex-direction: column; align-items: stretch; gap: 6px; padding: 8px; border: 3px solid; border-radius: 14px; background: var(--card); color: var(--fg); font: inherit; cursor: pointer; }
.cardname { font-weight: 700; padding: 4px 8px; border-radius: 8px; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .92rem; }
caption { text-align: left; font-weight: 700; padding: 6px 0; }
th, td { border: 1px solid var(--line); padding: 4px 6px; text-align: left; }
.mapframe { position: relative; height: 560px; margin-top: 12px; border: 2px solid var(--line); border-radius: 16px; background: var(--card); overflow: hidden; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.maplines { position: absolute; left: 0; top: 0; width: 100%; pointer-events: none; }
.maphint { position: absolute; left: 10px; right: 10px; bottom: 8px; margin: 0; font-size: .8rem; color: var(--muted); pointer-events: none; }
.mapnode { position: absolute; min-height: 44px; min-width: 44px; max-width: 150px; padding: 6px 10px; border-radius: 22px; border: 2px solid rgba(0,0,0,.55); font: inherit; font-size: .92rem; line-height: 1.2; cursor: grab; touch-action: none; }
.mapnode.center { font-weight: 800; max-width: 170px; }
.mapnode.branch { font-weight: 700; }
.mapnode.locked { font-weight: 800; }
.mappanel { position: absolute; left: 10px; right: 10px; bottom: 8px; max-height: 160px; overflow-y: auto; z-index: 5; background: var(--card); color: var(--fg); border: 3px solid var(--fg); border-radius: 12px; padding: 8px 12px; box-shadow: 0 4px 14px rgba(0,0,0,.25); }
.mappanel h3 { margin: 0 0 .2rem; font-size: 1rem; }
.mappanel .btn { min-height: 44px; padding: 4px 14px; }
.mappanel p { margin: 0 0 .5rem; }
footer { margin-top: 24px; font-size: .85rem; color: var(--muted); }
@media (max-width: 520px) {
  h1 { font-size: 1.25rem; }
  .nav .btn { flex: 1 1 40%; }
  .nav .field { order: -1; flex-basis: 100%; }
  .mapframe { height: 640px; }
  .mapnode { max-width: 120px; font-size: .85rem; }
}
</style>
</head>
<body>
<div id="app"></div>
<div id="live" class="sr-only" role="status" aria-live="polite"></div>
<noscript><p>Cette application a besoin de JavaScript (fonctionne sans Internet).</p></noscript>
<script>
var APP_CONFIG = {"version":"0.1.0","module":"maison"};
/* Noyau : textes, géométrie des dessins, moteur d'essais, linter,
 * stockage (IndexedDB avec repli mémoire), ZIP et CSV.
 * Aucune dépendance, aucun accès réseau. */
var CORE = (function () {
  var MAX_TRIES = 3;
  var LANG_IDS = ['fr', 'ht', 'en', 'es'];

  /* ---------- Textes ---------- */
  function tr(entry, lang) {
    if (!entry) return '';
    if (typeof entry === 'string') return entry;
    return entry[lang] !== undefined && entry[lang] !== '' ? entry[lang] : (entry.fr || '');
  }
  function fmt(str, vars) {
    return String(str).replace(/\{(\w+)\}/g, function (m, k) {
      return vars && vars[k] !== undefined ? String(vars[k]) : m;
    });
  }
  /* Première lettre du mot principal, sans l'article (« la poignée » → p). */
  function firstLetter(name, lang) {
    var s = String(name).trim();
    var lead = { fr: /^(le |la |les |l['’])/i, es: /^(el |la |los |las )/i, en: /^(the )/i };
    if (lead[lang]) s = s.replace(lead[lang], '');
    return s.charAt(0).toLocaleUpperCase();
  }

  /* ---------- Hasard reproductible ---------- */
  function rng(seed) {
    var s = (seed >>> 0) || 1;
    return function () {
      s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0;
      return s / 4294967296;
    };
  }
  function shuffle(list, rand) {
    var a = list.slice();
    rand = rand || Math.random;
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(rand() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  /* ---------- Géométrie ---------- */
  function bbox(sh) {
    if (sh.t === 'rect') return [sh.x, sh.y, sh.x + sh.w, sh.y + sh.h];
    if (sh.t === 'circle') return [sh.cx - sh.r, sh.cy - sh.r, sh.cx + sh.r, sh.cy + sh.r];
    if (sh.t === 'ellipse') return [sh.cx - sh.rx, sh.cy - sh.ry, sh.cx + sh.rx, sh.cy + sh.ry];
    var xs = sh.pts.map(function (p) { return p[0]; });
    var ys = sh.pts.map(function (p) { return p[1]; });
    return [Math.min.apply(null, xs), Math.min.apply(null, ys), Math.max.apply(null, xs), Math.max.apply(null, ys)];
  }
  function inPolygon(pts, x, y) {
    var inside = false;
    for (var i = 0, j = pts.length - 1; i < pts.length; j = i++) {
      var xi = pts[i][0], yi = pts[i][1], xj = pts[j][0], yj = pts[j][1];
      if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside;
    }
    return inside;
  }
  function distToSegment(x, y, a, b) {
    var dx = b[0] - a[0], dy = b[1] - a[1];
    var len2 = dx * dx + dy * dy;
    var t = len2 ? Math.max(0, Math.min(1, ((x - a[0]) * dx + (y - a[1]) * dy) / len2)) : 0;
    var px = a[0] + t * dx, py = a[1] + t * dy;
    return Math.sqrt((x - px) * (x - px) + (y - py) * (y - py));
  }
  function shapeContains(sh, x, y, sw) {
    if (sh.t === 'rect') return x >= sh.x && x <= sh.x + sh.w && y >= sh.y && y <= sh.y + sh.h;
    if (sh.t === 'circle') return (x - sh.cx) * (x - sh.cx) + (y - sh.cy) * (y - sh.cy) <= sh.r * sh.r;
    if (sh.t === 'ellipse') {
      var ex = (x - sh.cx) / sh.rx, ey = (y - sh.cy) / sh.ry;
      return ex * ex + ey * ey <= 1;
    }
    if (sh.t === 'poly') return inPolygon(sh.pts, x, y);
    if (sh.t === 'line') {
      for (var i = 1; i < sh.pts.length; i++) {
        if (distToSegment(x, y, sh.pts[i - 1], sh.pts[i]) <= (sw || 4) / 2 + 1) return true;
      }
      return false;
    }
    return false;
  }
  /* Partie visible (la plus haute dans l'ordre de dessin) au point (x, y). */
  function partAt(obj, x, y) {
    for (var i = obj.parts.length - 1; i >= 0; i--) {
      var p = obj.parts[i];
      for (var k = 0; k < p.shapes.length; k++) {
        if (shapeContains(p.shapes[k], x, y, p.sw)) return p.id;
      }
    }
    return null;
  }
  /* Position grossière d'un point dans le dessin, pour l'aide 1. */
  function sideOf(obj, partId) {
    var part = findPart(obj, partId);
    var all = [Infinity, Infinity, -Infinity, -Infinity];
    obj.parts.forEach(function (p) {
      p.shapes.forEach(function (s) {
        var b = bbox(s);
        all = [Math.min(all[0], b[0]), Math.min(all[1], b[1]), Math.max(all[2], b[2]), Math.max(all[3], b[3])];
      });
    });
    var rx = (part.a[0] - all[0]) / (all[2] - all[0]);
    var ry = (part.a[1] - all[1]) / (all[3] - all[1]);
    var dx = Math.abs(rx - 0.5), dy = Math.abs(ry - 0.5);
    if (dx < 0.17 && dy < 0.17) return 'middle';
    if (dy >= dx) return ry < 0.5 ? 'top' : 'bottom';
    return rx < 0.5 ? 'left' : 'right';
  }
  function findPart(obj, partId) {
    for (var i = 0; i < obj.parts.length; i++) if (obj.parts[i].id === partId) return obj.parts[i];
    return null;
  }

  /* Place les étiquettes à gauche et à droite du dessin, sans chevauchement. */
  function layoutLabels(obj, viewBox) {
    var W = viewBox[0], H = viewBox[1], mid = W / 2, gap = 30, top = 22, bottom = H - 12;
    var sorted = obj.parts.slice().sort(function (a, b) { return a.a[1] - b.a[1] || a.a[0] - b.a[0]; });
    var sides = { left: [], right: [] };
    sorted.forEach(function (p) {
      var side;
      if (p.a[0] < mid - 2) side = 'left';
      else if (p.a[0] > mid + 2) side = 'right';
      else side = sides.left.length <= sides.right.length ? 'left' : 'right';
      sides[side].push(p);
    });
    var out = [];
    ['left', 'right'].forEach(function (side) {
      var list = sides[side], ys = [];
      list.forEach(function (p, i) {
        var y = Math.max(p.a[1], top);
        if (i > 0) y = Math.max(y, ys[i - 1] + gap);
        ys.push(y);
      });
      var overflow = ys.length ? ys[ys.length - 1] - bottom : 0;
      if (overflow > 0) {
        for (var i = ys.length - 1; i >= 0; i--) {
          ys[i] -= overflow;
          if (i > 0 && ys[i - 1] > ys[i] - gap) overflow = ys[i - 1] - (ys[i] - gap); else break;
        }
      }
      list.forEach(function (p, i) {
        out.push({
          id: p.id, side: side,
          lx: side === 'left' ? 124 : W - 124,
          ly: ys[i],
          ax: p.a[0], ay: p.a[1]
        });
      });
    });
    return out;
  }

  /* ---------- Validateurs ---------- */
  var validate = {
    single: function (given, expected) { return given !== null && given !== undefined && given !== '' && given === expected; },
    multi: function (given, expected) {
      if (!given || given.length !== expected.length) return false;
      var e = expected.slice().sort(), g = given.slice().sort();
      for (var i = 0; i < e.length; i++) if (e[i] !== g[i]) return false;
      return true;
    },
    point: function (obj, x, y, expectedPart) { return partAt(obj, x, y) === expectedPart; }
  };

  /* ---------- Moteur d'essais : 2 aides avant la solution ---------- */
  function createAttempt() {
    return { fails: 0, solved: false, revealed: false, firstTry: false };
  }
  function submitAttempt(att, ok) {
    if (att.solved || att.revealed) return { status: att.solved ? 'correct' : 'solution', att: att };
    if (ok) {
      att.solved = true;
      att.firstTry = att.fails === 0;
      return { status: 'correct', att: att };
    }
    att.fails += 1;
    if (att.fails >= MAX_TRIES) { att.revealed = true; return { status: 'solution', att: att }; }
    return { status: att.fails === 1 ? 'hint1' : 'hint2', att: att };
  }
  function canShowSolution(att) { return att.solved || att.revealed; }

  /* ---------- Questions ---------- */
  function buildShowQuestions(obj, rand) {
    return shuffle(obj.parts.map(function (p) { return p.id; }), rand);
  }
  function buildArrowQuestions(obj, rand) {
    return shuffle(obj.parts.map(function (p) { return p.id; }), rand);
  }
  /* QCM : 4 bonnes parties maximum + 3 intrus pris dans d'autres objets,
   * en évitant les intrus dont le nom existe aussi dans l'objet. */
  function buildCheckQuestion(objects, objId, lang, rand) {
    var obj = objects.filter(function (o) { return o.id === objId; })[0];
    var good = shuffle(obj.parts, rand).slice(0, Math.min(4, obj.parts.length));
    var ownNames = obj.parts.map(function (p) { return tr(p.name, lang); });
    var pool = [];
    objects.forEach(function (o) {
      if (o.id === objId) return;
      o.parts.forEach(function (p) {
        var n = tr(p.name, lang);
        if (ownNames.indexOf(n) === -1 && n !== tr(obj.name, lang)) pool.push({ obj: o, part: p });
      });
    });
    var seen = {};
    var intruders = shuffle(pool, rand).filter(function (it) {
      var n = tr(it.part.name, lang);
      if (seen[n]) return false;
      seen[n] = true; return true;
    }).slice(0, 3);
    var options = good.map(function (p) { return { key: objId + '.' + p.id, name: p.name, good: true }; })
      .concat(intruders.map(function (it) { return { key: it.obj.id + '.' + it.part.id, name: it.part.name, good: false, from: it.obj.id }; }));
    return { options: shuffle(options, rand), answer: good.map(function (p) { return objId + '.' + p.id; }) };
  }

  /* ---------- Contraste ---------- */
  function lum(hex) {
    var h = hex.replace('#', '');
    if (h.length === 3) h = h.split('').map(function (c) { return c + c; }).join('');
    var rgb = [0, 2, 4].map(function (i) {
      var c = parseInt(h.substr(i, 2), 16) / 255;
      return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
    });
    return 0.2126 * rgb[0] + 0.7152 * rgb[1] + 0.0722 * rgb[2];
  }
  function contrastRatio(a, b) {
    var la = lum(a), lb = lum(b);
    return (Math.max(la, lb) + 0.05) / (Math.min(la, lb) + 0.05);
  }
  function textOn(bg) {
    return contrastRatio(bg, '#000000') >= contrastRatio(bg, '#FFFFFF') ? '#000000' : '#FFFFFF';
  }

  /* ---------- Linter (bloquant au build) ---------- */
  function lint(content) {
    var errors = [];
    function need4(entry, where) {
      LANG_IDS.forEach(function (l) {
        if (!entry || typeof entry[l] !== 'string' || (entry[l].trim() === '' && !(where === 'ui.autoNotice' && l === 'fr'))) {
          errors.push('Traduction manquante [' + l + '] : ' + where);
        }
      });
    }
    Object.keys(content.ui).forEach(function (k) { need4(content.ui[k], 'ui.' + k); });
    Object.keys(content.ui).forEach(function (k) {
      var ph = (content.ui[k].fr.match(/\{\w+\}/g) || []).sort().join();
      LANG_IDS.forEach(function (l) {
        if ((String(content.ui[k][l]).match(/\{\w+\}/g) || []).sort().join() !== ph) errors.push('Variables différentes [' + l + '] : ui.' + k);
      });
    });
    var objIds = {};
    var W = content.viewBox[0], H = content.viewBox[1];
    content.objects.forEach(function (o) {
      if (objIds[o.id]) errors.push('Identifiant d\'objet en double : ' + o.id);
      objIds[o.id] = true;
      ['name', 'intro', 'limit', 'misconception'].forEach(function (f) { need4(o[f], o.id + '.' + f); });
      if (!/^Croire que /.test(o.misconception.fr)) errors.push('Idée reçue non cadrée par « Croire que… » : ' + o.id);
      if (contrastRatio(o.color, textOn(o.color)) < 4.5) errors.push('Contraste < 4,5:1 pour la couleur de ' + o.id);
      if (contrastRatio(o.color, '#FFFFFF') < 3) errors.push('Contraste < 3:1 entre la couleur de ' + o.id + ' et le fond (bordures)');
      if (o.parts.length < 4 || o.parts.length > 8) errors.push('Nombre de parties hors de 4 à 8 : ' + o.id);
      var partIds = {}, frNames = {};
      o.parts.forEach(function (p) {
        var where = o.id + '.' + p.id;
        if (partIds[p.id]) errors.push('Identifiant de partie en double : ' + where);
        partIds[p.id] = true;
        need4(p.name, where + '.name');
        need4(p.def, where + '.def');

    ]));
    stage.appendChild(el('p', { class: 'register' }, [
      el('strong', { text: t('register') + ' : ' }), t('registerObs') + '. ',
      el('strong', { text: t('limit') + ' : ' }), n(o.limit)
    ]));
    stage.appendChild(select('actsel', t('activity'), C.activities.map(function (a) { return [a, actLabel(a)]; }), ui.act, function (v) { startSession(v); render(); }));
    var body;
    if (ui.act === 'discover' || !session) body = renderDiscover(o);
    else if (session.done) body = renderDone(o);
    else if (session.act === 'show') body = renderShow(o);
    else if (session.act === 'arrow') body = renderArrow(o);
    else body = renderCheck(o);
    stage.appendChild(body);
    return stage;
  }

  function badges(objId) {
    var p = prog(objId);
    var parts = [p.seen ? t('seen') : null].concat(['show', 'arrow', 'check'].map(function (a) { return p[a] && p[a].done ? actLabel(a) + ' ' + p[a].score + '/' + p[a].total : null; }));
    return parts.filter(Boolean).join(' · ');
  }

  function renderGuided() {
    var i = C.objects.map(function (o) { return o.id; }).indexOf(ui.obj);
    var nav = el('div', { class: 'row nav' }, [
      el('button', { type: 'button', class: 'btn', id: 'prevobj', text: '← ' + t('prev'), disabled: i === 0, onclick: function () { goObj(C.objects[i - 1].id); } }),
      select('objsel', t('object'), C.objects.map(function (o, k) { return [o.id, (k + 1) + '. ' + n(o.name)]; }), ui.obj, goObj),
      el('button', { type: 'button', class: 'btn', id: 'nextobj', text: t('next') + ' →', disabled: i === C.objects.length - 1, onclick: function () { goObj(C.objects[i + 1].id); } })
    ]);
    return el('div', {}, [nav, renderStage()]);
  }
  function goObj(id) { ui.obj = id; startSession('discover'); render(); }

  function renderFree() {
    if (ui.freeOpen) {
      return el('div', {}, [el('button', { type: 'button', class: 'btn', id: 'back', text: '← ' + t('backGallery'), onclick: function () { ui.freeOpen = false; render(); } }), renderStage()]);
    }
    return el('ul', { class: 'gallery' }, C.objects.map(function (o) {
      return el('li', {}, [el('button', { type: 'button', class: 'card', id: 'card-' + o.id, style: { borderColor: o.color }, onclick: function () { ui.obj = o.id; ui.freeOpen = true; startSession('discover'); render(); } }, [
        drawObject(o, { mini: true }),
        el('span', { class: 'cardname', style: { background: o.color, color: K.textOn(o.color) }, text: n(o.name) }),
        el('span', { class: 'muted small', text: badges(o.id) })
      ])]);
    }));
  }

  function renderMap() {
    var frame = el('div', { class: 'mapframe', id: 'mapframe' });
    setTimeout(function () {
      M.render(frame, {
        center: { label: t('mapCenter'), info: t('mapHint') },
        hint: t('mapHint'),
        closeLabel: t('close'),
        positions: ui.mapPos,
        expanded: ui.mapExpanded,
        openInfo: ui.mapInfo,
        onOpen: function (info) { ui.mapInfo = info; },
        onToggle: function (id) {
          ui.mapExpanded = ui.mapExpanded === id ? null : id;
          ui.mapFocus = id;
          render();
        },
        branches: C.objects.map(function (o) {
          var unlocked = prog(o.id).seen;
          var leafColor = M.mix(o.color, 0.72);
          return {
            id: o.id, label: n(o.name), color: o.color, textColor: K.textOn(o.color),
            info: n(o.intro) + ' ' + t('mapBranchInfo', { n: o.parts.length }),
            leaves: o.parts.map(function (p) {
              return { id: p.id, label: unlocked ? n(p.name) : '?', title: unlocked ? n(p.name) : '?', color: leafColor, textColor: K.textOn(leafColor),
                info: unlocked ? n(p.def) : t('mapLocked'), locked: !unlocked };
            })
          };
        })
      });
      if (ui.mapFocus) {
        var b = frame.querySelector('[data-node="' + ui.mapFocus + '"]');
        ui.mapFocus = null;
        if (b) b.focus();
      }
    }, 0);
    return frame;
  }

  /* ---------- Réglages, profils, sauvegardes ---------- */
  function applySettings() {
    var h = document.documentElement;
    h.lang = S.lang;
    h.setAttribute('data-size', S.settings.size);
    h.classList.toggle('dys', S.settings.dyslexia);
    h.classList.toggle('hc', S.settings.contrast);
    h.classList.toggle('noanim', S.settings.noAnim);
    document.title = t('appTitle');
  }
  function toggle(id, key) {
    return el('div', { class: 'cbrow' }, [
      el('input', { type: 'checkbox', id: id, checked: S.settings[key], onchange: function (e) { S.settings[key] = e.target.checked; save(); render(); } }),
      el('label', { for: id, text: t(key === 'dyslexia' ? 'dyslexia' : key === 'contrast' ? 'contrast' : 'noAnim') })
    ]);
  }
  function download(name, data, type) {
    var blob = new Blob([data], { type: type });
    var a = el('a', { href: URL.createObjectURL(blob), download: name });
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
  }
  function exportZip() {
    var zip = K.makeZip([
      { name: 'sauvegarde.json', data: JSON.stringify(S, null, 2) },
      { name: 'LISEZMOI.txt', data: 'Sauvegarde du dictionnaire visuel (la maison). Pour la restaurer : bouton « Restaurer (ZIP) ».\r\n' }
    ]);
    download('dictionnaire-visuel-sauvegarde.zip', zip, 'application/zip');
  }
  function importZip(file) {
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var files = K.readZip(new Uint8Array(reader.result));
        var f = files.filter(function (x) { return x.name === 'sauvegarde.json'; })[0];
        var st = f && K.sanitizeState(JSON.parse(K.fromUtf8(f.data)));
        if (!st) throw new Error('invalide');
        S = st; save(); ui.notice = ''; render(); say(t('importOk'));
      } catch (e) { say(t('importFail')); alert(t('importFail')); }
    };
    reader.readAsArrayBuffer(file);
  }
  function exportCsv() {
    var rows = [['pseudo', 'objet', 'activite', 'vu', 'termine', 'score_premier_coup', 'total']];
    S.profiles.forEach(function (pr) {
      C.objects.forEach(function (o) {
        var p = (S.progress[pr.id] || {})[o.id] || {};
        ['show', 'arrow', 'check'].forEach(function (a) {
          var r = p[a] || {};
          rows.push([pr.pseudo || t('guest'), o.name.fr, a, p.seen ? 1 : 0, r.done ? 1 : 0, r.score === undefined ? '' : r.score, r.total === undefined ? '' : r.total]);
        });
      });
    });
    download('dictionnaire-visuel-classe.csv', K.toCsv(rows), 'text/csv;charset=utf-8');
  }
  function renderProgress() {
    var head = el('tr', {}, [el('th', { scope: 'col', text: t('object') })].concat(C.activities.map(function (a) { return el('th', { scope: 'col', text: actLabel(a) }); })));
    var rows = C.objects.map(function (o) {
      var p = prog(o.id);
      return el('tr', {}, [el('th', { scope: 'row', text: n(o.name) })].concat(C.activities.map(function (a) {
        if (a === 'discover') return el('td', { text: p.seen ? '✓ ' + t('seen') : '–' });
        return el('td', { text: p[a] && p[a].done ? '✓ ' + p[a].score + '/' + p[a].total : '–' });
      })));
    });
    return el('div', { class: 'tablewrap' }, [el('table', {}, [el('caption', { text: t('progress') }), el('thead', {}, [head]), el('tbody', {}, rows)])]);
  }

  function renderHeader() {
    var profOpts = S.profiles.map(function (p) { return [p.id, p.pseudo || t('guest')]; }).concat([['__new', t('newProfile')]]);
    var file = el('input', { type: 'file', id: 'importfile', accept: '.zip,application/zip', class: 'sr-only', onchange: function (e) { if (e.target.files[0]) importZip(e.target.files[0]); } });
    return el('header', {}, [
      el('h1', { text: t('appTitle') }),
      el('div', { class: 'controls' }, [
        select('langsel', t('language'), C.langs.map(function (l) { return [l.id, l.name + (l.auto ? ' [auto]' : '')]; }), S.lang, function (v) {
          S.lang = v; save();
          if (session && session.act === 'check' && !session.done) startSession('check');
          render();
        }),
        select('profsel', t('profile'), profOpts, S.current, function (v) {
          if (v === '__new') {
            var pseudo = (prompt(t('pseudoPrompt')) || '').trim().slice(0, 40);
            if (pseudo) { var id = 'p' + Date.now(); S.profiles.push({ id: id, pseudo: pseudo }); S.current = id; }
          } else S.current = v;
          save(); startSession('discover'); render();
        }),
        select('viewsel', t('view'), [['guided', t('viewGuided')], ['free', t('viewFree')], ['map', t('viewMap')]], S.view, function (v) { S.view = v; ui.freeOpen = false; save(); render(); })
      ]),
      el('details', { class: 'panel', id: 'settings', open: ui.settingsOpen }, [
        el('summary', { text: t('settings'), onclick: function () { ui.settingsOpen = !ui.settingsOpen; } }),
        select('sizesel', t('textSize'), [['normal', t('sizeNormal')], ['large', t('sizeLarge')], ['xlarge', t('sizeXLarge')]], S.settings.size, function (v) { S.settings.size = v; save(); render(); }),
        toggle('dys', 'dyslexia'), toggle('hc', 'contrast'), toggle('noanim', 'noAnim')
      ]),
      el('details', { class: 'panel', id: 'datapanel', open: ui.dataOpen }, [
        el('summary', { text: t('progress') + ' · ' + t('data'), onclick: function () { ui.dataOpen = !ui.dataOpen; } }),
        renderProgress(),
        el('div', { class: 'row' }, [
          el('button', { type: 'button', class: 'btn', id: 'expzip', text: t('exportZip'), onclick: exportZip }),
          el('label', { for: 'importfile', class: 'btn', id: 'impzip', tabindex: '0', role: 'button', onkeydown: function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); file.click(); } } }, [t('importZip')]),
          file,
          el('button', { type: 'button', class: 'btn', id: 'expcsv', text: t('exportCsv'), onclick: exportCsv })
        ]),
        el('p', { class: 'warning', text: t('csvWarning') })
      ]),
      S.lang !== 'fr' ? el('p', { class: 'autonotice', text: t('autoNotice') }) : null
    ]);
  }

  function render() {
    var focusId = document.activeElement && document.activeElement.id;
    applySettings();
    root.textContent = '';
    root.appendChild(renderHeader());
    var main = el('main', { id: 'main' });
    if (S.view === 'map') { main.appendChild(el('h2', { class: 'sr-only', text: t('viewMap') })); main.appendChild(renderMap()); }
    else if (S.view === 'free') main.appendChild(renderFree());
    else main.appendChild(renderGuided());
    root.appendChild(main);
    root.appendChild(el('footer', { text: t('footer') + ' · v' + APP_CONFIG.version }));
    if (focusId) {
      var f = document.getElementById(focusId);
      if (f) f.focus();
      else if (session && session.feedback.length) { var nq = document.getElementById('nextq') || document.getElementById('validate'); if (nq) nq.focus(); }
    } else if (session && document.getElementById('nextq')) document.getElementById('nextq').focus();
  }

  function boot() {
    root = document.getElementById('app');
    live = document.getElementById('live');
    render();
    K.openStore('dictionnaire-visuel-maison').then(function (s) {
      store = s;
      return s.get('state');
    }).then(function (saved) {
      var st = K.sanitizeState(saved);
      if (st) S = st;
      startSession('discover');
      render();
    }).catch(function () { startSession('discover'); render(); });
  }

  window.APP = { boot: boot, state: function () { return S; }, ui: ui, startSession: function (a) { startSession(a); render(); }, session: function () { return session; } };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
</body>
</html>
